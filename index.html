<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인내의 숲</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-START-->
<div id="app">

  <!-- 스타트 화면 -->
  <section id="start" class="screen start">
    <div class="start-card">
      <svg class="start-tree" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="112" rx="44" ry="5" class="t-ground"/>
        <path d="M54 112 C56 96 55 86 52 78 L68 78 C65 86 64 96 66 112 Z" class="t-trunk"/>
        <circle cx="60" cy="50" r="34" class="t-canopy"/>
        <circle cx="36" cy="62" r="20" class="t-canopy"/>
        <circle cx="84" cy="62" r="20" class="t-canopy"/>
        <circle cx="60" cy="26" r="20" class="t-canopy2"/>
        <circle cx="46" cy="44" r="7" fill="#E5534B"/>
        <circle cx="74" cy="38" r="7" fill="#F2B705"/>
        <circle cx="62" cy="62" r="7" fill="#3B82D6"/>
        <circle cx="38" cy="66" r="7" fill="#8E5BD6"/>
        <circle cx="84" cy="64" r="7" fill="#F08A24"/>
      </svg>
      <p class="eyebrow">섬김 챌린지</p>
      <h1 class="title">인내의 숲</h1>
      <p class="lead">이름만 입력하면 시작! 내 일정을 적고 체크해서<br>끝낼 때마다 나만의 나무 두 그루에 스티커가 붙어요.</p>
      <form id="loginForm" class="login" autocomplete="off">
        <label for="nameInput" class="sr-only">이름</label>
        <input id="nameInput" name="name" maxlength="12" placeholder="이름을 입력하세요" required>
        <button type="submit" class="btn-game">숲에 들어가기</button>
      </form>
      <p class="login-err" id="loginErr" role="alert" hidden></p>
      <p class="mode" id="modeStart"></p>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="screen game" hidden>
    <header class="hud">
      <div class="brand">인내의 숲</div>
      <div class="hud-right">
        <span class="sync" id="syncBadge"></span>
        <span class="me-chip" id="meChip"></span>
        <button id="logoutBtn" class="btn-ghost" type="button">나가기</button>
      </div>
    </header>

    <div class="week-bar">
      <nav class="weeks" id="weekTabs" role="tablist" aria-label="주차 선택"></nav>
      <button type="button" class="btn-ghost today" id="todayBtn">이번 주</button>
    </div>

    <section class="trees" aria-label="나의 나무">
      <figure class="panel tree-panel tree-main">
        <div class="panel-head">
          <h2 id="tree-main-title">인내의 숲 나무</h2>
          <span class="count" id="tree-main-count"></span>
        </div>
        <div class="tree-wrap"><svg id="tree-main" viewBox="0 0 400 440" role="img" aria-label="인내의 숲 나무"></svg></div>
        <figcaption>청소·정리 항목을 끝낼 때마다 1개</figcaption>
      </figure>
      <figure class="panel tree-panel tree-massage">
        <div class="panel-head">
          <h2 id="tree-massage-title">마사지 섬김 나무</h2>
          <span class="count" id="tree-massage-count"></span>
        </div>
        <div class="tree-wrap"><svg id="tree-massage" viewBox="0 0 400 440" role="img" aria-label="마사지 섬김 나무"></svg></div>
        <figcaption>마사지 섬김을 하면 1개</figcaption>
      </figure>
    </section>

    <section class="panel sched-panel" aria-labelledby="schedTitle">
      <div class="panel-head">
        <h2 id="schedTitle">나의 스케줄</h2>
        <span class="count" id="schedRange"></span>
      </div>
      <p class="hint">날짜를 눌러 시간을 정하고, 끝나면 동그라미를 눌러 체크하세요. 청소·정리 항목은 칸을 모두 체크하면 인내의 숲 나무에, 마사지 섬김은 한 번 체크하면 마사지 섬김 나무에 스티커가 붙어요. 스티커는 1번 칸부터 순서대로 채워져요.</p>
      <div id="groups"></div>
    </section>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<!--APP-END-->
<script src="app.js"></script>
</body>
</html>
